  <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switch 出欠管理</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      font-size: 28px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      margin: 20px auto;
      min-height: 60px;
    }

    .ready {
      color: #333;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d00;
    }
  </style>
</head>

<body>

  <h1>Switch 出欠管理</h1>

<button id="startButton">カメラを起動</button>

<div id="reader"></div>

  <div id="result" class="ready">
    QRコードを読み取ってください
  </div>

<script>

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbw8o1bt7D6fYGZ7rkW26PYBsMEf_6JTGRSNiTQEiFYvimo8ymwGu_3l-JIsBGx2Cs56sw/exec";

let busy = false;
let scanner;

// ピッ♪音
function beep() {
  const AudioContext =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContext) return;

  const audioContext = new AudioContext();

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.frequency.value = 1000;
  gain.gain.value = 0.15;

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();

  setTimeout(() => {
    oscillator.stop();
    audioContext.close();
  }, 120);
}
function callGAS(qrUrl) {
  const callbackName =
    "gasCallback_" + Date.now();

  window[callbackName] = function(data) {
    delete window[callbackName];

    document.getElementById("result").innerHTML =
      data.result;

    document.getElementById("result").className =
      "success";

    beep();

    setTimeout(() => {
      document.getElementById("result").innerHTML =
        "QRコードを読み取ってください";

      document.getElementById("result").className =
        "ready";

      busy = false;

    }, 10000);
  };

  const script = document.createElement("script");

  script.src =
    GAS_URL +
    "?api=2&qr=" +
    encodeURIComponent(qrUrl) +
    "&callback=" +
    callbackName;

  script.onerror = function() {
    delete window[callbackName];

    document.getElementById("result").innerHTML =
      "通信エラー";

    document.getElementById("result").className =
      "error";

    busy = false;
  };

  document.body.appendChild(script);

  setTimeout(() => {
    script.remove();
  }, 10000);
}


// QRを読み取ったとき
function onScanSuccess(decodedText) {

  if (busy) return;

  busy = true;

  document.getElementById("result").innerHTML =
    "読み取り中…";

  beep();

callGAS(decodedText);
}


// カメラ開始
document.getElementById("startButton").addEventListener("click", function() {

  beep();

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },
    onScanSuccess
  ).catch(function(error) {

    document.getElementById("result").innerHTML =
      "カメラを起動できませんでした";

    document.getElementById("result").className =
      "error";

  });

});

</script>

</body>
</html>
